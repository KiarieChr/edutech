# ==============================================================================
# Nginx Configuration for Fahari Academia
# Target location on server: /etc/nginx/sites-available/academia
# Symlink: ln -s /etc/nginx/sites-available/academia /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP to HTTPS Redirection Block
server {
    listen 80;
    listen [::]:80;
    server_name 
        app.royalsoftwares.co.ke 
        www.app.royalsoftwares.co.ke 
        academia.royalsoftwares.co.ke 
        *.academia.royalsoftwares.co.ke 
        *.royalsoftwares.co.ke;

    return 301 https://$host$request_uri;
}

# 2. APP Subdomain (Direct Django Backend & Admin)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.royalsoftwares.co.ke www.app.royalsoftwares.co.ke;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/royalsoftwares.co.ke-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalsoftwares.co.ke-0001/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    # Static Files
    location /static/ {
        alias /var/www/academia/edutech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media Files
    location /media/ {
        alias /var/www/academia/edutech/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to Django Gunicorn Backend
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# 3. ACADEMIA & Wildcard Subdomains (Frontend SPA + Backend APIs)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 
        academia.royalsoftwares.co.ke 
        *.academia.royalsoftwares.co.ke 
        *.royalsoftwares.co.ke;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/royalsoftwares.co.ke-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/royalsoftwares.co.ke-0001/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    root /var/www/academia/fahari-academia-front/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
    }

    # --------------------------------------------------------------------------
    # BACKEND REVERSE PROXY LOCATIONS
    # IMPORTANT: Keep trailing URI clean (http://127.0.0.1:8000) so original paths
    # are preserved identically for DRF routers and workforce modules.
    # --------------------------------------------------------------------------

    # Core Django REST APIs (/api/...)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Workforce API Endpoints (/workforce/api/...)
    location /workforce/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django Admin Portal (/admin/...)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Files from Backend
    location /static/ {
        alias /var/www/academia/edutech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media / Uploaded Documents
    location /media/ {
        alias /var/www/academia/edutech/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Django Channels WebSocket (if enabled)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Static Assets (Cache immutable js/css)
    location /assets/ {
        alias /var/www/academia/fahari-academia-front/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA Fallback: Any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
