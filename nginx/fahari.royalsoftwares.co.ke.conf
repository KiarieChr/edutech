# /etc/nginx/sites-available/fahari.royalsoftwares.co.ke
# React (Vite) frontend — static SPA served directly by Nginx
#
# Build the React app first:
#   npm run build          (outputs to dist/)
#   rsync -av dist/ deploy@vps:/var/www/fahari_academia/
#
# Then on the VPS:
#   sudo ln -s /etc/nginx/sites-available/fahari.royalsoftwares.co.ke.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d fahari.royalsoftwares.co.ke
#   sudo nginx -t && sudo systemctl reload nginx

# ── Redirect bare HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fahari.royalsoftwares.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fahari.royalsoftwares.co.ke;

    # ── TLS (managed by Certbot) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/fahari.royalsoftwares.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahari.royalsoftwares.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    # CSP — adjust if you use inline scripts/styles
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.royalsoftwares.co.ke; connect-src 'self' https://api.royalsoftwares.co.ke;"
        always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/fahari.royalsoftwares.co.ke.access.log;
    error_log  /var/log/nginx/fahari.royalsoftwares.co.ke.error.log warn;

    # ── Root: Vite build output ────────────────────────────────────────────────
    root  /var/www/fahari_academia;
    index index.html;

    # ── Vite hashed assets — cache aggressively ────────────────────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback: all unknown paths → index.html (React Router handles it) ─
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must NOT be cached so users always get the latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Optional: proxy /api/ calls to the backend if you want same-origin ─────
    # Uncomment the block below if you prefer not to have a separate API domain.
    # location /api/ {
    #     proxy_pass         https://api.royalsoftwares.co.ke;
    #     proxy_set_header   Host              api.royalsoftwares.co.ke;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
