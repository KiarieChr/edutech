# /etc/nginx/sites-available/api.royalsoftwares.co.ke
# Django/DRF backend served via Gunicorn (Unix socket)
#
# Setup steps on the VPS:
#   sudo ln -s /etc/nginx/sites-available/api.royalsoftwares.co.ke.conf \
#              /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.royalsoftwares.co.ke
#   sudo nginx -t && sudo systemctl reload nginx

upstream django_backend {
    server unix:/run/gunicorn/fahari_academia.sock fail_timeout=0;
    # Alternatively use TCP:  server 127.0.0.1:8000 fail_timeout=0;
}

# ── Redirect bare HTTP → HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.royalsoftwares.co.ke;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.royalsoftwares.co.ke;

    # ── TLS (managed by Certbot) ──────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.royalsoftwares.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.royalsoftwares.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           DENY                                  always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # ── CORS (browser → API) ──────────────────────────────────────────────────
    # Handled by Django (django-cors-headers), but we allow preflight here too.
    add_header Access-Control-Allow-Origin  "https://fahari.royalsoftwares.co.ke" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-CSRFToken" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/api.royalsoftwares.co.ke.access.log;
    error_log  /var/log/nginx/api.royalsoftwares.co.ke.error.log warn;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size 50M;   # avatar / document uploads

    # ── Static files (collectstatic output) ───────────────────────────────────
    location /static/ {
        alias /var/www/edutech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files (user uploads) ────────────────────────────────────────────
    location /media/ {
        alias /var/www/edutech/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Daraja / Paystack webhook callbacks ───────────────────────────────────
    # These are called by external servers — no browser CORS needed.
    location ~ ^/payments/(mpesa/callback|paystack/webhook)/ {
        proxy_pass         http://django_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Everything else → Gunicorn ────────────────────────────────────────────
    location / {
        proxy_pass         http://django_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_redirect     off;
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;

        # WebSocket support (if you ever add channels / live notifications)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
